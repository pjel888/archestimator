# oh-my-codex top-level settings (must be before any [table])
model_reasoning_effort = "medium"
developer_instructions = "You have oh-my-codex installed. AGENTS.md is the orchestration brain and main control surface. Follow AGENTS.md for skill/keyword routing, $name workflow invocation, and role-specialized subagents; when spawning native subagents, set `agent_type` to an installed role and never omit it for OMX work. Use outcome-first, concise progress updates: state the target result, constraints, validation evidence, and stop condition before adding process detail. Native subagents live in .codex/agents and may handle independent parallel subtasks within one Codex session or team pane. Skills load from the installed Codex skill roots shown in session context; native-agent TOMLs are role prompts, not skills. Treat installed prompts as narrower execution surfaces under AGENTS.md authority."
# oh-my-codex seeded behavioral defaults (uninstall removes unchanged defaults)
model_auto_compact_token_limit = 200000
# End oh-my-codex seeded behavioral defaults

model = "gpt-5.5"
model_context_window = 400000
plan_mode_reasoning_effort = "xhigh"
[mcp_servers.code-review-graph]
args = [
    "code-review-graph==2.3.5",
    "serve",
]
command = "uvx"
suppress_unstable_features_warning = true
startup_timeout_sec = 15

[features]
multi_agent = true
child_agents_md = true
hooks = false
goals = true

[shell_environment_policy.set]
USE_OMX_EXPLORE_CMD = "0"

[agents]
max_depth = 2

# Managed by LazyCodex: multi_agent_v2 is re-disabled on every Codex session start
# because enabling it fails every turn with HTTP 400 (openai/codex#26753).
# Opt out: LAZYCODEX_CONFIG_MIGRATION_DISABLED=1 (or OMO_CODEX_CONFIG_MIGRATION_DISABLED=1).
max_threads = 6
[features.multi_agent_v2]
enabled = false

# OMX TUI StatusLine (Codex CLI v0.101.0+)
[tui]
# omx:managed-status-line
status_line = ["model-with-reasoning", "git-branch", "context-remaining", "total-input-tokens", "total-output-tokens", "five-hour-limit", "weekly-limit"]
