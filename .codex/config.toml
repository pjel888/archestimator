# oh-my-codex top-level settings (must be before any [table])
model_reasoning_effort = "medium"
developer_instructions = "You have oh-my-codex installed. AGENTS.md is the orchestration brain and main control surface. Follow AGENTS.md for skill/keyword routing, $name workflow invocation, and role-specialized subagents; when spawning native subagents, set `agent_type` to an installed role and never omit it for OMX work. Use outcome-first, concise progress updates: state the target result, constraints, validation evidence, and stop condition before adding process detail. Native subagents live in .codex/agents and may handle independent parallel subtasks within one Codex session or team pane. Skills load from the installed Codex skill roots shown in session context; native-agent TOMLs are role prompts, not skills. Treat installed prompts as narrower execution surfaces under AGENTS.md authority. Auto-select the AGENTS.md host tier before orchestration: native-subagent and concurrent-heavy-command ceilings are 0/1 at 8 GiB or less, 2/1 at 9-31 GiB, 4/2 at 32-47 GiB, and 6/4 at 48 GiB or more; current pressure may only reduce them. Low-memory mode uses serial specialist passes, deterministic shards, cooldown checks, and no local GitNexus/codegraph indexing or CLI impact analysis. Codex App verification guardrail: run the Playwright, browser, screenshot, or visual evidence selected by the automatic Q0-Q3 profile whenever changed behavior crosses a browser boundary; speed may select the tier but never erase required proof."
model = "gpt-5.6"
plan_mode_reasoning_effort = "high"
[mcp_servers.code-review-graph]
args = [
    "code-review-graph==2.3.5",
    "serve",
]
command = "uvx"
suppress_unstable_features_warning = true
startup_timeout_sec = 15

[features]
multi_agent = true
child_agents_md = true
hooks = false
goals = true

[shell_environment_policy.set]
USE_OMX_EXPLORE_CMD = "0"

[agents]
max_depth = 1

# The model catalog overrides multi_agent_v2.enabled=false for gpt-5.6, so this flag
# does NOT prevent V2. The real fix for the "collaboration.spawn_agent reserved for
# use by this model" 400 error (openai/codex#31864) is tool_namespace="agents" —
# it avoids the reserved "collaboration" namespace collision.
max_threads = 6
[features.multi_agent_v2]
tool_namespace = "agents"
enabled = false

# OMX TUI StatusLine (Codex CLI v0.101.0+)
[tui]
# omx:managed-status-line
status_line = ["model-with-reasoning", "git-branch", "context-remaining", "total-input-tokens", "total-output-tokens", "five-hour-limit", "weekly-limit"]

[sandbox_workspace_write]
network_access = true
