name: CI

on:
  pull_request:
  push:
    branches: [main, feat/**]

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        # actions/checkout v5
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Setup Bun
        # oven-sh/setup-bun v2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck, lint, and tests
        run: bun run validate
      - name: Build
        run: bun run build
      - name: Performance budget advisory
        # ponytail: WP-P4-01 — non-blocking advisory per OPEN-PERF-05.
        # Promotes to blocking after 2-week advisory window by setting
        # PERF_BUDGET_STRICT=1 (env) at the workflow level — the script honors
        # both the env var and the --strict arg.
        # When strict mode is active, continue-on-error is false so CI fails
        # on any route over budget.
        env:
          PERF_BUDGET_STRICT: ${{ secrets.PERF_BUDGET_STRICT }}
        run: bun run scripts/check-performance-budgets.mjs
        continue-on-error: ${{ secrets.PERF_BUDGET_STRICT != '1' }}
      - name: Impeccable design audit
        run: bun run lint:design
      - name: Install Playwright Chromium
        run: bunx playwright install chromium --with-deps
      - name: E2E smoke
        run: bun run test:e2e
      - name: Route transition performance smoke
        run: bun run test:e2e:perf
