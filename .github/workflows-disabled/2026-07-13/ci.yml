name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/**

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run type-check

  quality:
    name: Quality checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run validate:error-handling
      - run: bun run lint:design-system
      - run: bun run lint:design
      - run: bun run validate:planning-prompts

  tests:
    name: Unit and DOM tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun test tests/unit
      - run: bun run test:dom

  build:
    name: Production build
    needs: [typecheck, quality, tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build

  required:
    name: Required checks
    if: ${{ always() }}
    needs: [typecheck, quality, tests, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every dependency to succeed
        env:
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          test "$TYPECHECK_RESULT" = success
          test "$QUALITY_RESULT" = success
          test "$TESTS_RESULT" = success
          test "$BUILD_RESULT" = success

  release-candidate:
    name: Release candidate artifact
    needs: [required]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run cf:build
      - name: Generate immutable candidate metadata
        env:
          CANDIDATE_ID: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          CANDIDATE_ARTIFACT_ID: release-candidate-${{ github.run_id }}
        run: |
          MIGRATION_HEAD="$(find migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort | tail -n 1)"
          test -n "$MIGRATION_HEAD"
          CANDIDATE_EXPIRES_AT="$(date -u -d '+7 days' +'%Y-%m-%dT%H:%M:%S.000Z')"
          bun run scripts/generate-release-candidate-artifact.ts \
            --repository-root . \
            --output-dir release-candidate \
            --candidate-id "$CANDIDATE_ID" \
            --commit-sha "$GITHUB_SHA" \
            --environment production \
            --workflow-id "$GITHUB_WORKFLOW_REF" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-attempt "$GITHUB_RUN_ATTEMPT" \
            --migration-head "$MIGRATION_HEAD" \
            --expires-at "$CANDIDATE_EXPIRES_AT" \
            --artifact-id "$CANDIDATE_ARTIFACT_ID" \
            --binding-name ARCH_DB \
            --binding-name ARCH_UPLOADS_R2 \
            --non-secret-input-name NODE_ENV \
            --secret-binding-name BETTER_AUTH_SECRET \
            --provider-version-id opennextjs-cloudflare@1.20.1 \
            --node-version "$(node --version | sed 's/^v//')" \
            --bun-version "$(bun --version)"
          test -s release-candidate/release-candidate-metadata.json
          test -s release-candidate/worker-input-paths.json
          test -s release-candidate/release-candidate-payload-digest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-candidate-${{ github.run_id }}
          path: release-candidate
          if-no-files-found: error
          retention-days: 7
