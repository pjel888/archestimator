version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Manila
    open-pull-requests-limit: 5
    rebase-strategy: auto
    labels:
      - dependencies
      - security
    commit-message:
      prefix: deps
    groups:
      production-patches:
        dependency-type: production
        update-types:
          - patch
      development-tooling:
        dependency-type: development
        update-types:
          - patch
          - minor

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Manila
    open-pull-requests-limit: 5
    rebase-strategy: auto
    labels:
      - dependencies
      - security
    commit-message:
      prefix: ci
