name: CodeQL upload

on:
  push:
    branches: [main]
  schedule:
    - cron: "33 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-upload-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: security / codeql upload
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@adfda868f108ac4222129de456ea554034a27db7 # v4
        with:
          languages: javascript-typescript
          config-file: ./.github/codeql/codeql-config.yml
      - name: Analyze and upload
        uses: github/codeql-action/analyze@adfda868f108ac4222129de456ea554034a27db7 # v4
        with:
          category: /language:javascript-typescript
