name: CodeQL pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: codeql-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  codeql:
    name: security / codeql
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@adfda868f108ac4222129de456ea554034a27db7 # v4
        with:
          languages: javascript-typescript
          config-file: ./.github/codeql/codeql-config.yml
      - name: Analyze without remote upload
        uses: github/codeql-action/analyze@adfda868f108ac4222129de456ea554034a27db7 # v4
        with:
          category: /language:javascript-typescript
          output: artifacts/codeql
          upload: never
      - name: Upload sanitized SARIF
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codeql-pr-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/codeql/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
