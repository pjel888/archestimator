name: Verify release candidate

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Immutable CI run ID that produced the candidate artifact
        required: true
        type: string
      candidate_artifact_name:
        description: Immutable CI artifact name
        required: true
        type: string
      candidate_artifact_sha256:
        description: SHA-256 of the immutable CI artifact payload
        required: true
        type: string
      candidate_commit_sha:
        description: Full immutable commit SHA verified by CI
        required: true
        type: string
      environment:
        description: Candidate environment identity
        required: true
        type: choice
        options:
          - production

permissions:
  actions: read
  contents: read

jobs:
  verify-candidate:
    name: Verify immutable candidate metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ inputs.candidate_commit_sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.candidate_artifact_name }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: candidate
      - name: Verify immutable release candidate
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_commit_sha }}
          CANDIDATE_ENVIRONMENT: ${{ inputs.environment }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_name }}
          CANDIDATE_ARTIFACT_SHA256: ${{ inputs.candidate_artifact_sha256 }}
        run: |
          test -f candidate/release-candidate-metadata.json
          test -f candidate/worker-input-paths.json
          test -f candidate/release-candidate-payload-digest.json
          test -n "$CANDIDATE_SHA"
          test "${#CANDIDATE_SHA}" = 40
          bun run scripts/generate-release-candidate-artifact.ts \
            --verify-upload-payload true \
            --output-dir candidate
          bun run scripts/lib/release-candidate-metadata.ts \
            --metadata candidate/release-candidate-metadata.json \
            --required-inputs candidate/worker-input-paths.json \
            --sha "$CANDIDATE_SHA" \
            --environment "$CANDIDATE_ENVIRONMENT" \
            --artifact-id "$CANDIDATE_ARTIFACT_ID" \
            --artifact-sha256 "$CANDIDATE_ARTIFACT_SHA256"
