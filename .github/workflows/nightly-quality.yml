name: Nightly quality

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-quality
  cancel-in-progress: false

jobs:
  release-profile:
    name: quality / nightly release
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-quality
      - name: Install Playwright browsers
        run: bunx playwright install chromium firefox webkit --with-deps
      - name: Run Q3 release profile
        run: bun run quality:release
      - if: ${{ always() }}
        uses: ./.github/actions/upload-quality-artifacts
        with:
          name: nightly-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/quality/
            artifacts/junit/
            artifacts/coverage/
            artifacts/cucumber/
            artifacts/stryker/
            artifacts/playwright/
            artifacts/a11y/
            artifacts/security/

  operations:
    name: quality / nightly operations
    if: ${{ always() }}
    needs: release-profile
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-quality
      - name: Download release bundle evidence
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: nightly-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts
      - run: bun run quality:operations
      - if: ${{ always() }}
        uses: ./.github/actions/upload-quality-artifacts
        with:
          name: nightly-operations-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/quality/operations.json
            artifacts/performance/
            artifacts/observability/
            artifacts/migrations/

  gate:
    name: quality / nightly gate
    if: ${{ always() }}
    needs: [release-profile, operations]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every nightly dependency
        env:
          RELEASE_RESULT: ${{ needs.release-profile.result }}
          OPERATIONS_RESULT: ${{ needs.operations.result }}
        run: |
          test "$RELEASE_RESULT" = success
          test "$OPERATIONS_RESULT" = success
