<!-- @dsCard group="Colors" viewport="700x250" name="Editorial / marketing palette" subtitle="Loud brand register — big flat fields, near-black ink. Campaign surfaces only, never the product UI" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0}
  .grid{display:grid;grid-template-columns:repeat(6,1fr);font-family:var(--font-numeric)}
  .sw{height:200px;display:flex;flex-direction:column;justify-content:flex-end;padding:12px 12px 14px;box-sizing:border-box}
  .name{font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;line-height:1.3}
  .hex{font-size:9px;letter-spacing:.06em;margin-top:3px;opacity:.8}
  .l{color:var(--editorial-on-dark)} .d{color:var(--ink-editorial)}
</style>
</head>
<body>
  <div class="grid">
    <div class="sw" style="background:#232120"><span class="name l">Ink</span><span class="hex l">#232120</span></div>
    <div class="sw" style="background:#f24405"><span class="name l">Signal</span><span class="hex l">#F24405</span></div>
    <div class="sw" style="background:#f2c20d"><span class="name d">Mustard</span><span class="hex d">#F2C20D</span></div>
    <div class="sw" style="background:#b5c7b8"><span class="name d">Sage</span><span class="hex d">#B5C7B8</span></div>
    <div class="sw" style="background:#d4cfc3"><span class="name d">Stone</span><span class="hex d">#D4CFC3</span></div>
    <div class="sw" style="background:#f3e9e2"><span class="name d">On-signal</span><span class="hex d">#F3E9E2</span></div>
  </div>
</body>
</html>
