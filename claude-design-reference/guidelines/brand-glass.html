<!-- @dsCard group="Brand" viewport="700x230" name="Liquid glass — sidebar rail" subtitle="Frosted chrome floating on the grey canvas; orange logo slab + active pill" -->
<!DOCTYPE html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
body{margin:0;height:230px;font-family:var(--font-sf-pro);
  background:
    radial-gradient(420px 300px at 88% 96%, rgba(231,169,119,.35), transparent 60%),
    radial-gradient(360px 280px at 96% 88%, rgba(170,65,42,.18), transparent 60%),
    var(--canvas);
  display:flex;align-items:center;padding-left:26px;}
.rail{width:64px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;}
.logo{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;background:var(--glass-logo-bg);box-shadow:var(--glass-logo-shadow);margin-bottom:6px;}
.item{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;color:var(--secondary);font-size:18px;}
.item.active{background:var(--glass-nav-active-bg);box-shadow:var(--glass-nav-active-shadow);color:var(--brand-orange-dark);}
.cap{margin-left:28px;font-family:var(--font-numeric);font-size:9px;color:var(--tertiary);max-width:300px;line-height:1.5;}
</style></head><body>
<div class="rail ae-glass">
  <div class="logo"><img src="../assets/archestimator_logo_white.svg" width="24" height="24" alt=""/></div>
  <div class="item active">▦</div>
  <div class="item">▤</div>
  <div class="item">◷</div>
  <div class="item">⚙</div>
</div>
<div class="cap">One backdrop-filter per panel · frosted-white frost, dark ink · active pill = brand-orange gradient glass · the logo slab is the one orange glass surface. Children fake glass, never their own blur.</div>
</body></html>
