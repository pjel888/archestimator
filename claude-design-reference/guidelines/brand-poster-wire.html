<!-- @dsCard group="Brand" viewport="700x560" name="Marketing poster — wireframe register" subtitle="Dark editorial poster: pixel hero, isometric frame, status meta. The calm-but-loud campaign variant" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0}
  .poster{width:700px;height:560px;background:var(--ink-editorial);color:var(--editorial-on-dark);position:relative;overflow:hidden;font-family:var(--font-numeric);box-sizing:border-box}
  .wire{position:absolute;right:-70px;top:-30px;width:480px;height:480px;color:var(--signal);opacity:.9;pointer-events:none}
  .wire svg{width:100%;height:100%}
  .dither{position:absolute;left:-50px;bottom:-60px;width:300px;height:300px;background:url('../assets/brand-dither-orange.png') center/cover;opacity:.35;pointer-events:none}
  .pad{position:relative;z-index:2;padding:34px 36px}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase}
  .topbar .st{color:#8d8983}
  .topbar .st b{color:var(--signal);font-weight:600}
  .wordmark{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--editorial-on-dark)}
  .hero{font-family:var(--font-pixel);font-weight:800;text-transform:uppercase;font-size:80px;line-height:.84;letter-spacing:.01em;margin:118px 0 0;color:var(--editorial-on-dark)}
  .hero .o{color:var(--signal)}
  .sub{font-family:var(--font-landing);font-weight:430;font-size:16px;letter-spacing:-0.01em;line-height:1.4;max-width:380px;color:#bdb9b1;margin:20px 0 0}
  .foot{position:absolute;left:0;bottom:0;width:100%;display:flex;justify-content:space-between;padding:14px 36px;box-sizing:border-box;font-size:9px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#8d8983;border-top:1.5px solid #3a3734;z-index:2}
</style>
</head>
<body>
  <div class="poster">
    <div class="wire" id="wire"></div>
    <div class="dither"></div>
    <div class="pad">
      <div class="topbar">
        <span class="st">Operational status: <b>LIVE</b></span>
        <span class="wordmark">archestimator</span>
      </div>
      <h1 class="hero">DEFEND<br>EVERY<br>NUMBER<span class="o">.</span></h1>
      <p class="sub">Activity and version history track what changed, when, and why. The record answers for you.</p>
    </div>
    <div class="foot"><span>The cost intelligence layer for AEC teams</span><span>REV 3.0 — 2026</span></div>
  </div>
  <script>
    fetch('../assets/brand-wireframe.svg').then(r=>r.text()).then(s=>{document.getElementById('wire').innerHTML=s;});
  </script>
</body>
</html>
