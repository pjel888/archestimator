<!-- @dsCard group="Spacing" viewport="700x170" name="Radius — three steps only" subtitle="3px inside surfaces · 8px glass pills · 12px floating panels" -->
<!DOCTYPE html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
body{margin:0;background:var(--canvas);padding:22px;font-family:var(--font-sf-pro);}
.row{display:flex;gap:18px;}
.col{display:flex;flex-direction:column;gap:8px;align-items:center;}
.box{width:120px;height:64px;background:var(--surface);border:1px solid var(--hairline);}
.n{font-size:10px;font-weight:500;color:var(--ink);}
.t{font-family:var(--font-numeric);font-size:9px;color:var(--tertiary);}
</style></head><body>
<div class="row">
  <div class="col"><div class="box" style="border-radius:3px"></div><div class="n">xs · inside</div><div class="t">3px — cells, inputs, chips, buttons</div></div>
  <div class="col"><div class="box" style="border-radius:8px"></div><div class="n">glass-nav</div><div class="t">8px — pills in glass chrome</div></div>
  <div class="col"><div class="box" style="border-radius:12px;box-shadow:var(--shadow-float)"></div><div class="n">glass · panel</div><div class="t">12px — floating surfaces</div></div>
</div>
</body></html>
