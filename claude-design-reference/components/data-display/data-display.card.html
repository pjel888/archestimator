<!-- @dsCard group="Components" viewport="700x300" name="Badges, Chips & Avatars" subtitle="Status vocabulary, filter chips, square avatars" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; background: var(--surface); padding: 20px; }
  .grid { display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .lbl { font-family: var(--font-sf-pro); font-size: 9px; font-weight: 500; text-transform: uppercase; color: var(--tertiary); width: 78px; flex: none; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Badge, StatusBadge, Chip, Avatar } = window.ArchestimatorDesignSystem_3fbb6f;
  function Demo() {
    return (
      <div className="grid">
        <div className="row"><span className="lbl">Badge</span>
          <Badge tone="neutral">Material</Badge>
          <Badge tone="accent">Assembly</Badge>
          <Badge tone="success">Linked</Badge>
          <Badge tone="warning">Override</Badge>
          <Badge tone="danger">Detached</Badge>
        </div>
        <div className="row"><span className="lbl">Status</span>
          <StatusBadge status="approved" showDot>Approved</StatusBadge>
          <StatusBadge status="review" showDot>In review</StatusBadge>
          <StatusBadge status="draft">Draft</StatusBadge>
          <StatusBadge status="danger" showDot>Excluded</StatusBadge>
        </div>
        <div className="row"><span className="lbl">Chips</span>
          <Chip active>Materials</Chip>
          <Chip tone="neutral">Labor</Chip>
          <Chip tone="neutral">Equipment</Chip>
          <Chip tone="accent">Supplier</Chip>
          <Chip removable onRemove={() => {}}>Wilcon</Chip>
        </div>
        <div className="row"><span className="lbl">Avatars</span>
          <Avatar initials="PL" size="xs" />
          <Avatar initials="JD" size="sm" />
          <Avatar initials="MR" size="md" />
          <Avatar initials="AE" size="lg" />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
