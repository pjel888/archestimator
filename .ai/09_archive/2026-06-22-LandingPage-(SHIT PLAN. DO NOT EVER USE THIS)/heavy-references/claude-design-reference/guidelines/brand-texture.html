<!-- @dsCard group="Brand" viewport="700x260" name="Dither / X-halftone motif" subtitle="Generated cross-glyph density gradient — the brand's data-decay texture for color fields and edges" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0}
  .grid{display:grid;grid-template-columns:1fr 1fr;height:240px;font-family:var(--font-numeric)}
  .tile{position:relative;overflow:hidden;display:flex;align-items:flex-start;padding:12px 14px}
  .tile.signal{background:var(--signal)}
  .tile.stone{background:var(--stone)}
  .tex{position:absolute;inset:0;background-size:cover;background-position:center;pointer-events:none}
  .lab{position:relative;font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;z-index:1}
  .signal .lab{color:var(--editorial-on-signal)}
  .stone .lab{color:var(--ink-editorial)}
</style>
</head>
<body>
  <div class="grid">
    <div class="tile signal">
      <div class="tex" style="background-image:url('../assets/brand-dither.png');mix-blend-mode:multiply;opacity:.9"></div>
      <span class="lab">Ink dither on signal</span>
    </div>
    <div class="tile stone">
      <div class="tex" style="background-image:url('../assets/brand-dither-orange.png');opacity:.95"></div>
      <span class="lab">Signal dither on stone</span>
    </div>
  </div>
</body>
</html>
