<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces & canvas" subtitle="White paper floating on the grey canvas; warm proposal paper" -->
<!DOCTYPE html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
body{margin:0;background:var(--surface);padding:18px;font-family:var(--font-sf-pro);}
.row{display:flex;gap:10px;}
.sw{flex:1;border:1px solid var(--hairline);border-radius:var(--radius-xs);overflow:hidden;}
.chip{height:54px;}
.meta{padding:7px 9px;}
.nm{font-size:10px;font-weight:500;color:var(--ink);}
.hex{font-family:var(--font-numeric);font-size:9px;color:var(--tertiary);margin-top:2px;}
</style></head><body>
<div class="row">
  <div class="sw"><div class="chip" style="background:#ffffff;box-shadow:inset 0 0 0 1px #f2f2f2"></div><div class="meta"><div class="nm">surface</div><div class="hex">#FFFFFF · paper</div></div></div>
  <div class="sw"><div class="chip" style="background:#f5f5f5"></div><div class="meta"><div class="nm">canvas / muted</div><div class="hex">#F5F5F5 · field + select</div></div></div>
  <div class="sw"><div class="chip" style="background:#fffdf8;box-shadow:inset 0 0 0 1px #f2f2f2"></div><div class="meta"><div class="nm">proposal paper</div><div class="hex">#FFFDF8 · client docs</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--glass-bg);backdrop-filter:blur(6px)"></div><div class="meta"><div class="nm">glass</div><div class="hex">rgba(255·.72) frost</div></div></div>
</div>
</body></html>
