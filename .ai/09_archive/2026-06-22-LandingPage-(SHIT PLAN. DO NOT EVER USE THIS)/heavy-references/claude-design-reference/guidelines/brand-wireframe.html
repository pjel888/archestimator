<!-- @dsCard group="Brand" viewport="700x420" name="Isometric wireframe motif" subtitle="Constructed line-art — structural frame in signal orange. Hero/poster line motif for marketing surfaces" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0}
  .grid{display:grid;grid-template-columns:1fr 1fr;background:#000;gap:2px;font-family:var(--font-numeric)}
  .tile{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;height:416px}
  .dark{background:var(--ink-editorial)}
  .sage{background:var(--sage)}
  .wire{width:78%;height:78%;display:flex;align-items:center;justify-content:center}
  .wire svg{width:100%;height:100%}
  .on-dark{color:var(--signal)}
  .on-sage{color:var(--ink-editorial)}
  .lab{position:absolute;top:14px;left:16px;font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;z-index:2}
  .dark .lab{color:var(--editorial-on-dark)}
  .sage .lab{color:var(--ink-editorial)}
  .stat{position:absolute;bottom:14px;right:16px;font-family:var(--font-pixel);font-weight:800;font-size:30px;text-transform:uppercase;z-index:2}
  .dark .stat{color:var(--signal)}
  .sage .stat{color:var(--ink-editorial)}
</style>
</head>
<body>
  <div class="grid">
    <div class="tile dark">
      <span class="lab">Frame · signal on ink</span>
      <div class="wire on-dark"></div>
      <span class="stat">182F</span>
    </div>
    <div class="tile sage">
      <span class="lab">Frame · ink on sage</span>
      <div class="wire on-sage"></div>
      <span class="stat">21K</span>
    </div>
  </div>
  <script>
    fetch('../assets/brand-wireframe.svg').then(r=>r.text()).then(svg=>{
      document.querySelectorAll('.wire').forEach(el=>{el.innerHTML=svg;});
    });
  </script>
</body>
</html>
