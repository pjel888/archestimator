<!-- @dsCard group="Brand" viewport="700x560" name="Marketing poster — editorial register" subtitle="The full loud brand: pixel hero, signal field, dither edge, mono meta, stat blocks. Campaign/social/deck only" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0}
  .poster{width:700px;background:var(--signal);color:var(--editorial-on-signal);position:relative;overflow:hidden;font-family:var(--font-numeric)}
  .dither{position:absolute;right:-60px;top:-40px;width:420px;height:420px;background:url('../assets/brand-dither-orange.png') center/cover;mix-blend-mode:multiply;opacity:.55;pointer-events:none}
  .pad{position:relative;z-index:1;padding:30px 34px 0}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start}
  .eyebrow{font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-editorial)}
  .eyebrow .hl{color:var(--editorial-on-signal)}
  .wordmark{font-family:var(--font-numeric);font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--ink-editorial)}
  .hero{font-family:var(--font-pixel);font-weight:600;text-transform:uppercase;font-size:88px;line-height:.86;letter-spacing:.02em;color:var(--ink-editorial);margin:46px 0 14px}
  .sub{font-family:var(--font-landing);font-weight:430;font-size:17px;letter-spacing:-0.01em;line-height:1.35;max-width:440px;color:var(--editorial-on-signal);margin:0 0 30px}
  .stats{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1.5px solid var(--ink-editorial)}
  .stat{padding:16px 18px 18px;border-right:1.5px solid var(--ink-editorial);color:var(--ink-editorial)}
  .stat:last-child{border-right:none}
  .stat .k{font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
  .stat .v{font-family:var(--font-pixel);font-weight:800;font-size:34px;line-height:1;margin-top:8px}
  .foot{position:relative;z-index:1;display:flex;justify-content:space-between;padding:10px 34px 16px;font-size:9px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-editorial);opacity:.8}
</style>
</head>
<body>
  <div class="poster">
    <div class="dither"></div>
    <div class="pad">
      <div class="topbar">
        <span class="eyebrow">COST INTELLIGENCE LAYER · <span class="hl">LIVE</span></span>
        <span class="wordmark">archestimator</span>
      </div>
      <h1 class="hero">NEVER<br>START<br>FROM ZERO</h1>
      <p class="sub">The prices, suppliers, and revisions you build compound into a layer your next proposal starts ahead of.</p>
    </div>
    <div class="stats">
      <div class="stat"><div class="k">Rebuild time</div><div class="v">0H</div></div>
      <div class="stat"><div class="k">Reused lines</div><div class="v">1.2K</div></div>
      <div class="stat"><div class="k">Defensible</div><div class="v">100%</div></div>
    </div>
    <div class="foot"><span>FROM COST PROPOSAL TO CLIENT APPROVAL</span><span>REV 3.0 — 2026</span></div>
  </div>
</body>
</html>
