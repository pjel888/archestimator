<!-- @dsCard group="Type" viewport="700x290" name="Pixel hero — Doto" subtitle="Robotic dot-matrix display for marketing/campaign surfaces only — never product UI or the wordmark" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0}
  .wrap{background:var(--ink-editorial);color:var(--editorial-on-dark);padding:30px 34px;font-family:var(--font-pixel)}
  .eyebrow{font-family:var(--font-pixel);font-size:12px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--signal);margin:0 0 16px}
  .hero{font-family:var(--font-pixel);font-weight:800;text-transform:uppercase;font-size:74px;line-height:.86;letter-spacing:.01em;margin:0;color:var(--editorial-on-dark)}
  .hero .o{color:var(--signal)}
  .row{display:flex;gap:26px;align-items:baseline;margin-top:22px;flex-wrap:wrap}
  .spec{font-family:var(--font-pixel);text-transform:uppercase}
  .w5{font-weight:500;font-size:26px;color:#8d8983}
  .w7{font-weight:700;font-size:26px;color:#bdb9b1}
  .w9{font-weight:900;font-size:26px;color:var(--editorial-on-dark)}
  .meta{font-family:var(--font-numeric);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#75716b;margin-top:18px}
</style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">Campaign hero · Doto</p>
    <h1 class="hero">QUOTE<br>FASTER<span class="o">.</span></h1>
    <div class="row">
      <span class="spec w5">Aa 500</span>
      <span class="spec w7">Aa 700</span>
      <span class="spec w9">Aa 900</span>
    </div>
    <p class="meta">var(--font-pixel) · uppercase · weight 700–900 · tracking +0.01em · brand surfaces only</p>
  </div>
</body>
</html>
