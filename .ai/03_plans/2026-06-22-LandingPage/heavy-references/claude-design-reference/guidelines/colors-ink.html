<!-- @dsCard group="Colors" viewport="700x150" name="Ink — text scale" subtitle="Strong / default / subtle / AA-safe" -->
<!DOCTYPE html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
body{margin:0;background:var(--surface);padding:18px;font-family:var(--font-sf-pro);}
.row{display:flex;gap:10px;}
.sw{flex:1;border:1px solid var(--hairline);border-radius:var(--radius-xs);overflow:hidden;}
.chip{height:54px;}
.meta{padding:7px 9px;}
.nm{font-size:10px;font-weight:500;color:var(--ink);}
.hex{font-family:var(--font-numeric);font-size:9px;color:var(--tertiary);margin-top:2px;}
</style></head><body>
<div class="row">
  <div class="sw"><div class="chip" style="background:#3d3d3d"></div><div class="meta"><div class="nm">ink / strong</div><div class="hex">#3D3D3D · --ink</div></div></div>
  <div class="sw"><div class="chip" style="background:#5d5d5d"></div><div class="meta"><div class="nm">secondary</div><div class="hex">#5D5D5D · body</div></div></div>
  <div class="sw"><div class="chip" style="background:#7f7f7f"></div><div class="meta"><div class="nm">tertiary</div><div class="hex">#7F7F7F · subtle</div></div></div>
  <div class="sw"><div class="chip" style="background:#6b6b6b"></div><div class="meta"><div class="nm">muted-fg</div><div class="hex">#6B6B6B · AA 5.3:1</div></div></div>
</div>
</body></html>
