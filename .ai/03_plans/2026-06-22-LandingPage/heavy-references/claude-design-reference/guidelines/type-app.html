<!DOCTYPE html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
body{margin:0;background:var(--surface);padding:20px;font-family:var(--font-sf-pro);}
.r{display:flex;align-items:baseline;gap:14px;padding:7px 0;border-bottom:1px solid var(--hairline);}
.r:last-child{border-bottom:0;}
.tag{font-family:var(--font-numeric);font-size:9px;color:var(--tertiary);width:128px;flex:none;}
</style></head><body>
<div class="r"><span class="tag">title · 12 / 500</span><span style="font-size:12px;font-weight:500;color:var(--ink)">Lewis Residence estimate</span></div>
<div class="r"><span class="tag">subtitle · 11 / 500</span><span style="font-size:11px;font-weight:500;color:var(--ink)">Ground Floor · Living Room</span></div>
<div class="r"><span class="tag">body · 10 / 400</span><span style="font-size:10px;font-weight:400;color:var(--secondary)">Coffee table allowance, supplier Wilcon Depot, unit cost reused from last project.</span></div>
<div class="r"><span class="tag">button · 10 / 500</span><span style="font-size:10px;font-weight:500;color:var(--ink)">Add component</span></div>
<div class="r"><span class="tag">label · 9 / 500</span><span style="font-size:9px;font-weight:500;text-transform:uppercase;color:var(--tertiary)">Unit cost</span></div>
<div class="r"><span class="tag">label-sm · 8 / 400</span><span style="font-size:8px;font-weight:400;text-transform:uppercase;color:var(--tertiary)">Pricing date 2026-05</span></div>
</body></html>
