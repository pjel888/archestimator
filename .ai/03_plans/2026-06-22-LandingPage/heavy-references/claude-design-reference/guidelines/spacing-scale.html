<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4 / 8 / 12 / 20 / 48 / 64 / 112 · app gutters 16–24" -->
<!DOCTYPE html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
body{margin:0;background:var(--surface);padding:20px;font-family:var(--font-sf-pro);}
.row{display:flex;align-items:flex-end;gap:14px;}
.col{display:flex;flex-direction:column;align-items:center;gap:6px;}
.bar{background:var(--brand-orange);border-radius:1px;width:18px;}
.t{font-family:var(--font-numeric);font-size:9px;color:var(--tertiary);}
.n{font-size:9px;font-weight:500;color:var(--ink);}
</style></head><body>
<div class="row">
  <div class="col"><div class="bar" style="height:4px"></div><div class="n">xs</div><div class="t">4</div></div>
  <div class="col"><div class="bar" style="height:8px"></div><div class="n">sm</div><div class="t">8</div></div>
  <div class="col"><div class="bar" style="height:12px"></div><div class="n">md</div><div class="t">12</div></div>
  <div class="col"><div class="bar" style="height:20px"></div><div class="n">lg</div><div class="t">20</div></div>
  <div class="col"><div class="bar" style="height:48px"></div><div class="n">xl</div><div class="t">48</div></div>
  <div class="col"><div class="bar" style="height:64px"></div><div class="n">xxl</div><div class="t">64</div></div>
  <div class="col"><div class="bar" style="height:90px"></div><div class="n">section</div><div class="t">112</div></div>
</div>
</body></html>
