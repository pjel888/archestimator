<!-- @dsCard group="Colors" viewport="700x150" name="Brand orange — clay terracotta" subtitle="Landing / brand / glass-accent ONLY — never general app chrome" -->
<!DOCTYPE html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
body{margin:0;background:var(--surface);padding:18px;font-family:var(--font-sf-pro);}
.row{display:flex;gap:10px;}
.sw{flex:1;border:1px solid var(--hairline);border-radius:var(--radius-xs);overflow:hidden;}
.chip{height:54px;}
.meta{padding:7px 9px;}
.nm{font-size:10px;font-weight:500;color:var(--ink);}
.hex{font-family:var(--font-numeric);font-size:9px;color:var(--tertiary);margin-top:2px;}
</style></head><body>
<div class="row">
  <div class="sw"><div class="chip" style="background:#aa412a"></div><div class="meta"><div class="nm">brand-orange</div><div class="hex">#AA412A · clay · mark</div></div></div>
  <div class="sw"><div class="chip" style="background:#8c3623"></div><div class="meta"><div class="nm">orange-dark</div><div class="hex">#8C3623</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--brand-orange-soft)"></div><div class="meta"><div class="nm">orange-soft</div><div class="hex">14% on white</div></div></div>
  <div class="sw"><div class="chip" style="background:#e7a977"></div><div class="meta"><div class="nm">amber</div><div class="hex">#E7A977 · bloom</div></div></div>
  <div class="sw"><div class="chip" style="background:#f4cdb0"></div><div class="meta"><div class="nm">peach</div><div class="hex">#F4CDB0 · bloom</div></div></div>
</div>
</body></html>
