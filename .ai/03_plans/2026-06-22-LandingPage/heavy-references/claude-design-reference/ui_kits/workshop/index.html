<!-- @dsCard group="Workshop" viewport="1440x900" name="Estimate workspace" subtitle="The heart of the product — tree · estimate sheet · library dock · budget bar" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Archestimator — Estimate Workspace</title>
<link rel="stylesheet" href="../../styles.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  html, body { margin: 0; height: 100%; }
  /* Live WorkshopGlassBackdrop mesh: calm cool-grey base (#eef0f3) with two
     whisper-faint blooms, so the frosted workspace surface reads as glass over
     a non-flat field. Mirrors src/components/workshop/WorkshopGlassBackdrop.tsx. */
  body {
    font-family: var(--font-sf-pro); color: var(--ink); font-size: 10px;
    background:
      radial-gradient(560px circle at 0% 1%, rgba(70,82,104,.05), transparent 460px),
      radial-gradient(840px circle at 100% 100%, rgba(170,65,42,.022), transparent 700px),
      #eef0f3;
  }

  /* Workshop canvas: floating rail column (the live shell reserves
     --sidebar-content-offset = 80px = inset 8 + collapsed 64 + gap 8 for the
     rail) then the ONE glass workspace surface, which itself holds the tree ·
     sheet · dock · budget bar as transparent zones. */
  .ws { display: grid; grid-template-columns: 64px 1fr; height: 100vh; gap: 8px; padding: 8px; box-sizing: border-box; }

  /* ── Floating glass nav rail (sidebar) ────────────────────────────────── */
  .rail { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 0; height: 100%; box-sizing: border-box; }
  .logo { width: 40px; height: 40px; border-radius: 8px; display: grid; place-items: center; background: var(--glass-logo-bg); box-shadow: var(--glass-logo-shadow); margin-bottom: 8px; }
  .navitem { width: 40px; height: 40px; border: 0; background: transparent; border-radius: 8px; color: var(--secondary); font-size: 19px; display: grid; place-items: center; cursor: pointer; transition: background .15s; }
  .navitem:hover { background: var(--glass-nav-hover-bg); color: var(--ink); }
  .navitem.is-active { background: var(--glass-nav-active-bg); box-shadow: var(--glass-nav-active-shadow); color: var(--brand-orange-dark); }

  /* ── ONE workspace glass surface ──────────────────────────────────────────
     The live shell wraps header + content + footer in a single frosted panel
     (.workshop-workspace-glass-surface): one backdrop-filter, warm chrome wash,
     12px radius, glass border + soft float shadow + inset top specular. The tree,
     centre sheet, and dock live INSIDE it as transparent columns divided by
     hairlines — no per-panel paper float anymore. Mirrors globals.css. */
  .workspace {
    display: grid;
    grid-template-columns: 248px 1fr 380px;
    min-height: 0;
    overflow: hidden;
    border-radius: var(--radius-glass);
    border: 1px solid var(--glass-border);
    background:
      radial-gradient(100% 82% at 94% 100%, rgba(170,65,42,.12) 0%, transparent 54%),
      radial-gradient(72% 58% at 6% 14%, rgba(70,82,104,.10) 0%, transparent 58%),
      linear-gradient(155deg, rgba(248,250,251,.54) 0%, rgba(232,234,235,.44) 48%, rgba(221,217,213,.5) 100%);
    -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
    backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
    box-shadow: var(--glass-shadow), var(--glass-inset-hi);
  }
  /* The centre column is itself a stack (bar · toolbar · sheet · budget bar). */
  .center { display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
  /* Hairline-only dividers between the three workspace zones (no shadow, no fill). */
  .tree-panel { border-right: 1px solid var(--glass-border); }
  .dock { border-left: 1px solid var(--glass-border); }
  .tree-panel, .dock { display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

  /* Liquid-glass chrome button: translucent fill, bright top edge, soft shadow —
     NO child backdrop-filter (the surface owns the one blur). Mirrors
     .workshop-liquid-button in globals.css. */
  .liquid-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    border: 1px solid rgba(30,35,50,.08); border-radius: var(--radius-xs);
    background: rgba(255,255,255,.86); color: var(--secondary);
    font-family: var(--font-sf-pro); font-size: 10px; font-weight: 500;
    cursor: pointer; padding: 6px 9px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.72), 0 1px 2px rgba(30,35,50,.06);
    transition: background-color .14s, border-color .14s, box-shadow .14s, color .14s, transform .14s;
  }
  .liquid-btn:hover { background: rgba(255,255,255,.96); border-color: rgba(30,35,50,.12); color: var(--ink); box-shadow: inset 0 1px 0 rgba(255,255,255,.8), 0 1px 3px rgba(30,35,50,.08); }
  .liquid-btn:active { transform: translateY(1px) scale(.985); }
  .liquid-btn.icon { width: 26px; height: 26px; padding: 0; font-size: 14px; }
  .liquid-btn i { font-size: 13px; }
  /* The light-orange "Add" affordance (named app exception, est. sheet only). */
  .liquid-btn.add { background: var(--add-affordance-bg); border-color: transparent; color: var(--add-affordance-fg); }
  .liquid-btn.add:hover { background: var(--add-affordance-bg-hover); color: var(--add-affordance-fg-hover); }

  /* Search field — transparent over the frost (a glass-chrome input, not paper). */
  .search { display: flex; align-items: center; gap: 6px; margin: 12px; padding: 7px 9px; border: 1px solid var(--glass-border); border-radius: var(--radius-xs); background: rgba(255,255,255,.5); color: var(--tertiary); font-size: 10px; }
  .search i { font-size: 13px; }
  .panel-toolbar { display: flex; justify-content: space-between; align-items: center; padding: 0 10px 8px; }
  .tool-left, .tool-right { display: flex; gap: 4px; align-items: center; }
  .panel-tab { padding: 8px 14px; font-size: 11px; font-weight: 500; color: var(--ink); border-bottom: 1px solid var(--glass-border); }
  .tree-scroll { flex: 1; overflow-y: auto; padding: 6px 0; }

  .tree-row { display: flex; align-items: center; gap: 6px; padding: 5px 10px 5px 0; cursor: pointer; }
  .tree-row:hover { background: var(--glass-nav-hover-bg); }
  .tree-row.is-active { background: var(--glass-nav-active-bg); box-shadow: var(--glass-nav-active-shadow); }
  .tree-label { font-size: 10px; color: var(--secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tree-row.is-active .tree-label { color: var(--ink); font-weight: 500; }
  .lib-price { margin-left: auto; font-family: var(--font-sf-pro); font-size: 10px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--ink); padding-right: 8px; }
  .lib-unit { color: var(--tertiary); font-weight: 400; margin-left: 3px; }

  /* ── Centre: workspace bar + sheet (transparent chrome zones) ──────────── */
  .ws-bar { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-bottom: 1px solid var(--glass-border); }
  .ws-code { font-family: var(--font-numeric); font-size: 10px; color: var(--tertiary); }
  .ws-title { font-size: 11px; font-weight: 500; letter-spacing: .04em; }
  .ws-version { font-size: 10px; color: var(--tertiary); margin-left: auto; }
  .ws-actions { display: flex; align-items: center; gap: 8px; }
  .avatars { display: flex; gap: 4px; }
  .av { width: 22px; height: 22px; border-radius: var(--radius-xs); display: grid; place-items: center; font-size: 9px; font-weight: 500; color: #fff; }
  .av-pl { background: #2f6f64; } .av-le { background: #6a5acd; }

  .sheet-toolbar { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; }
  .sheet-search { margin: 0; flex: 1; max-width: 420px; }

  .sheet-scroll { flex: 1; overflow-y: auto; padding: 0 16px 16px; }
  /* Estimate sheet itself stays document-like: white paper rows on hairlines —
     the data surface reads as a crisp document floating in the frost. */
  .group-bar { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border: 1px solid var(--hairline); border-bottom: 0; background: rgba(255,255,255,.78); }
  .group-meta { display: flex; flex-direction: column; gap: 1px; }
  .group-code { font-family: var(--font-numeric); font-size: 8px; color: var(--tertiary); }
  .group-name { font-size: 11px; font-weight: 500; color: var(--ink); }
  .group-total { margin-left: auto; font-size: 11px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--ink); }

  .area-block { border: 1px solid var(--hairline); background: var(--surface); }
  .area-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--hairline); }
  .breadcrumb-mini { padding: 6px 12px; font-size: 9px; color: var(--tertiary); border-bottom: 1px solid var(--hairline); }
  table.sheet { width: 100%; border-collapse: collapse; }
  .sheet th { font-size: 9px; font-weight: 500; text-transform: uppercase; color: var(--tertiary); text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--hairline); background: var(--surface); }
  .sheet th.num, .sheet td.num { text-align: right; }
  .sheet td { font-size: 10px; color: var(--ink); padding: 8px 10px; border-bottom: 1px solid var(--hairline); vertical-align: middle; }
  .sheet td.num { font-variant-numeric: tabular-nums; font-weight: 500; }
  .sheet td.strong { color: var(--ink); }
  .sheet tr.sel td { background: var(--accent-soft); }
  .rn { font-family: var(--font-numeric); font-size: 9px; color: var(--tertiary); }
  .cb { display: inline-block; width: 13px; height: 13px; border: 1px solid var(--divider-sibling); border-radius: var(--radius-xs); background: #fff; }
  .cb[data-on="true"] { background: var(--primary); border-color: var(--primary); }
  .mat { display: flex; align-items: center; gap: 8px; }
  .thumb { width: 28px; height: 28px; border-radius: var(--radius-xs); flex: none; }
  .mat-text { display: flex; flex-direction: column; gap: 1px; }
  .mat-name { font-size: 10px; color: var(--ink); }
  .mat-sub { font-size: 9px; color: var(--tertiary); font-variant-numeric: tabular-nums; }
  .adj { text-align: left !important; }
  .adj-tag { display: inline-flex; align-items: center; gap: 4px; font-size: 9px; color: var(--secondary); }
  .drop-zone { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 14px; font-size: 10px; color: var(--tertiary); background: var(--surface-muted); border-top: 1px dashed var(--divider-sibling); }

  /* ── Budget bar — transparent glass-chrome footer (no paper fill) ──────── */
  .budget-bar { display: flex; align-items: center; gap: 22px; padding: 10px 16px; border-top: 1px solid var(--glass-border); }
  .crumb { font-size: 9px; color: var(--tertiary); }
  .budget-block { display: flex; flex-direction: column; gap: 1px; }
  .budget-block.right { margin-left: 0; }
  .bnum { font-size: 12px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--ink); }
  .bnum.danger { color: var(--danger); }
  .blabel { font-size: 8px; text-transform: uppercase; color: var(--tertiary); }
  .health { flex: 1; display: flex; flex-direction: column; gap: 3px; max-width: 360px; }
  .health-head { display: flex; justify-content: space-between; font-size: 8px; text-transform: uppercase; color: var(--tertiary); }
  .health-head .over { color: var(--danger); }
  .health-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, #7aa7d8 0 50%, #e89a8c 50% 100%); }
  .health-fill { height: 6px; }
  .health-note { font-size: 8px; color: var(--danger); }
  /* Ask Flip is a floating liquid-glass chrome button, clay accent glyph. */
  .ask-flip { margin-left: auto; }
  .ask-flip i { color: var(--brand-orange); }

  /* ── dock ─────────────────────────────────────────────────────────────── */
  .dock-tabs { display: flex; gap: 14px; padding: 0 14px; border-bottom: 1px solid var(--glass-border); }
  .dock-tab { padding: 8px 0; border: 0; border-bottom: 2px solid transparent; background: transparent; font-family: var(--font-sf-pro); font-size: 11px; font-weight: 500; color: var(--tertiary); cursor: pointer; }
  .dock-tab.is-active { color: var(--ink); border-bottom-color: var(--ink); }
  .viewby { display: flex; align-items: center; gap: 10px; padding: 10px 14px; }
  .viewby-label { font-size: 8px; text-transform: uppercase; color: var(--tertiary); }

  /* ── Non-blur / reduced-transparency fallback — opaque surface, no blur.
     Mirrors the @supports + prefers-reduced-transparency blocks in globals.css. */
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .workspace { background: var(--workshop-shell-chrome-bg-fallback, #e6e7e7); -webkit-backdrop-filter: none; backdrop-filter: none; }
    .liquid-btn { background: rgba(255,255,255,.82); }
  }
  @media (prefers-reduced-transparency: reduce) {
    .workspace { background: var(--workshop-shell-chrome-bg-fallback, #e6e7e7); -webkit-backdrop-filter: none; backdrop-filter: none; }
    .liquid-btn { background: rgba(255,255,255,.82); }
  }
  @media (prefers-reduced-motion: reduce) {
    .liquid-btn { transition: none; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="Workshop.jsx"></script>
</body>
</html>
