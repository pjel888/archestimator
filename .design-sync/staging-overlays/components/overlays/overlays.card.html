<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; background: var(--surface); padding: 20px; }
  .rows { display: flex; flex-direction: column; gap: 20px; }
  .row { display: flex; gap: 20px; flex-wrap: wrap; align-items: stretch; }
  .stage { position: relative; overflow: hidden; border: 1px solid var(--hairline);
    border-radius: var(--radius-xs); background: var(--canvas); }
  .stage--modal { width: 480px; height: 290px; }
  .stage--confirm { width: 360px; height: 290px; }
  .stage--sheet { width: 100%; height: 300px; }
  .ae-field { font-family: var(--font-sf-pro); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const NS = window.ArchestimatorDesignSystem_3fbb6f;
  const { Modal, ConfirmDialog, Sheet, Button, Field, Input } = NS;

  function Demo() {
    return (
      <div className="rows">
        <div className="row">
          <div className="stage stage--modal">
            <Modal
              inline
              title="Rename estimate sheet"
              description="This updates the sheet name across the project."
              footer={<>
                <Button variant="ghost">Cancel</Button>
                <Button variant="primary">Save</Button>
              </>}
            >
              <Field label="Sheet name"><Input defaultValue="Structural Works" /></Field>
            </Modal>
          </div>
          <div className="stage stage--confirm">
            <ConfirmDialog
              inline
              tone="destructive"
              title="Delete estimate sheet?"
              description="This permanently removes the sheet and its line items."
              confirmLabel="Delete"
            >
              Structural Works · ES-021 will be removed for everyone on the project.
            </ConfirmDialog>
          </div>
        </div>
        <div className="row">
          <div className="stage stage--sheet">
            <Sheet
              inline
              side="right"
              size="md"
              title="Component details"
              description="Coffee table allowance · WIL-204"
              footer={<Button variant="primary">Apply</Button>}
            >
              <Field label="Unit cost"><Input align="right" defaultValue="6,350.00" /></Field>
              <div style={{ height: 8 }} />
              <Field label="Supplier"><Input defaultValue="Wilcon Depot" /></Field>
            </Sheet>
          </div>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
